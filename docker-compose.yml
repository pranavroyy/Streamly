version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: streamly-db
    environment:
      POSTGRES_USER: ${DB_USER:-streamly_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-streamly_password}
      POSTGRES_DB: ${DB_NAME:-streamly_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-streamly_admin} -d ${DB_NAME:-streamly_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamly-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamly-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-streamly_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-streamly_admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-streamly_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - streamly-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamly-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - streamly-network

volumes:
  postgres_data:

networks:
  streamly-network:
    driver: bridge
